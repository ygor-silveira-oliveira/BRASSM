<section class="home-hero home-hero--intro" aria-labelledby="hero-title">
  <img
    src="/assets/images/hero/hero-main-hd.jpeg"
    alt="Woman wrapped in the Brazilian flag overlooking a waterfront skyline at sunset, with United States and Canadian flags in the background"
    width="1536"
    height="1024"
    fetchpriority="high"
    decoding="async"
    class="home-hero-image"
  />
  <div class="home-hero-overlay" aria-hidden="true"></div>
  <div class="container home-hero-content">
    <h1 id="hero-title" class="home-hero-title">
      <span class="home-hero-title-main">
        <span class="home-intro-accessible">BRASSM</span>
        <span class="home-intro-letters" aria-hidden="true"><span>B</span><span>R</span><span>A</span><span>S</span><span>S</span><span>M</span></span>
      </span>
      <span class="home-hero-title-sub">Brazilian Scholars for Sport Management</span>
    </h1>
  </div>
</section>

<section class="home-sections" id="home-highlights" aria-label="Highlights">
  <ul class="home-section-list" id="home-sections-list" role="list"></ul>

  <!-- Cada bloco usa o mesmo visual do hero; edite os dados em js/data/home-sections.js. -->
  <template id="home-section-template">
    <li class="home-hero">
      <img class="home-hero-image" alt="" width="1254" height="1254" loading="lazy" decoding="async">
      <div class="home-hero-overlay" aria-hidden="true"></div>
      <div class="container home-hero-content">
        <h2 class="home-hero-title">
          <span class="home-hero-title-main"></span>
          <span class="home-hero-title-sub"></span>
        </h2>
      </div>
    </li>
  </template>
</section>
